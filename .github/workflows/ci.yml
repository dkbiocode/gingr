name: Cross-Platform Build & Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue testing other platforms even if one fails
      matrix:
        include:
          # macOS - clang (Apple Silicon and Intel)
          - os: macos-13
            compiler: clang
            arch: x86_64
            qt-version: "5.15.*"
          - os: macos-14
            compiler: clang
            arch: arm64
            qt-version: "5.15.*"

          # Linux - gcc and clang
          - os: ubuntu-22.04
            compiler: gcc
            arch: x86_64
            qt-version: "5.15.*"
          - os: ubuntu-22.04
            compiler: clang
            arch: x86_64
            qt-version: "5.15.*"

          # Windows - MSVC and MinGW
          - os: windows-2022
            compiler: msvc
            arch: x64
            qt-version: "5.15.*"
          - os: windows-2022
            compiler: mingw
            arch: x64
            qt-version: "5.15.*"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: gingr-build
          environment-file: environment.yml
          auto-activate-base: false

      - name: Install dependencies (Conda)
        shell: bash -l {0}
        run: |
          conda install -y qt=${{ matrix.qt-version }} protobuf capnproto autoconf automake make

      - name: Install platform-specific dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          conda install -y gcc_linux-64 gxx_linux-64 libgl-devel-cos7-x86_64 mesa-libgl-devel-cos7-x86_64

      - name: Install platform-specific dependencies (Windows - MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        shell: bash -l {0}
        run: |
          # Install MSVC build tools via conda-forge
          conda install -y "m2-autoconf" "m2-automake" "m2-make"

      - name: Setup MSVC
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Display build environment
        shell: bash -l {0}
        run: |
          echo "=== Compiler Information ==="
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            gcc --version
            g++ --version
          elif [ "${{ matrix.compiler }}" = "clang" ]; then
            clang --version
            clang++ --version
          elif [ "${{ matrix.compiler }}" = "msvc" ]; then
            cl.exe 2>&1 | head -n 1 || echo "MSVC compiler"
          fi

          echo -e "\n=== Qt Information ==="
          qmake --version

          echo -e "\n=== Protobuf Information ==="
          protoc --version

          echo -e "\n=== Cap'n Proto Information ==="
          capnp --version

          echo -e "\n=== Conda Environment ==="
          conda info
          conda list | grep -E "(qt|protobuf|capnp)"

      - name: Build harvest-tools
        shell: bash -l {0}
        working-directory: harvest_src
        run: |
          ./bootstrap.sh

          # Set platform-specific flags
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA_CPPFLAGS="-std=c++17"
            EXTRA_LDFLAGS="-Wl,-rpath,$CONDA_PREFIX/lib"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            EXTRA_CPPFLAGS="-std=c++17"
            EXTRA_LDFLAGS="-Wl,-rpath,$CONDA_PREFIX/lib"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_CPPFLAGS="-std=c++17 -DUSE_THREADING=1"
            EXTRA_LDFLAGS=""
          fi

          CPPFLAGS="-I$CONDA_PREFIX/include $EXTRA_CPPFLAGS" \
          LDFLAGS="-L$CONDA_PREFIX/lib $EXTRA_LDFLAGS" \
          ./configure \
            --prefix=$CONDA_PREFIX \
            --with-protobuf=$CONDA_PREFIX \
            --with-capnp=$CONDA_PREFIX

          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          make install

      - name: Build test_compression
        shell: bash -l {0}
        working-directory: harvest_src
        run: |
          # Build the compression test
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.compiler }}" = "msvc" ]; then
            cl.exe /EHsc /std:c++17 \
              /I"$CONDA_PREFIX/include" \
              /I"src" \
              test_compression.cpp \
              src/harvest/*.cpp \
              /link /LIBPATH:"$CONDA_PREFIX/lib" \
              protobuf.lib capnp.lib kj.lib zlib.lib \
              /OUT:test_compression.exe
          else
            # Unix-like (macOS, Linux, MinGW)
            # Use pkg-config to get all protobuf dependencies (including abseil)
            export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig"
            ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }} \
              -std=c++17 \
              -I"$CONDA_PREFIX/include" \
              -Isrc \
              test_compression.cpp \
              -L"$CONDA_PREFIX/lib" \
              -Wl,-rpath,"$CONDA_PREFIX/lib" \
              -lharvest $(pkg-config --libs protobuf) -lcapnp -lkj -lz \
              -o test_compression
          fi

      - name: Run compression test
        shell: bash -l {0}
        working-directory: harvest_src
        run: |
          echo "=== Running Compression Test ==="
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./test_compression.exe
          else
            ./test_compression
          fi

          if [ $? -eq 0 ]; then
            echo "✓ Compression test passed!"
          else
            echo "✗ Compression test failed!"
            exit 1
          fi

      - name: Build Gingr
        shell: bash -l {0}
        run: |
          ./bootstrap.sh

          # Set platform-specific flags
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA_CPPFLAGS="-std=c++17"
            EXTRA_LDFLAGS="-Wl,-rpath,$CONDA_PREFIX/lib"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            EXTRA_CPPFLAGS="-std=c++17"
            EXTRA_LDFLAGS="-Wl,-rpath,$CONDA_PREFIX/lib"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA_CPPFLAGS="-std=c++17 -DUSE_THREADING=1"
            EXTRA_LDFLAGS=""
          fi

          CPPFLAGS="-I$CONDA_PREFIX/include $EXTRA_CPPFLAGS" \
          LDFLAGS="-L$CONDA_PREFIX/lib $EXTRA_LDFLAGS" \
          ./configure \
            --prefix=$CONDA_PREFIX \
            --with-protobuf=$CONDA_PREFIX \
            --with-capnp=$CONDA_PREFIX \
            --with-harvest=$CONDA_PREFIX

          qmake
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

      - name: Verify Gingr binary exists
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -d "Gingr.app" ]; then
              echo "✓ Gingr.app created successfully"
              ls -lh Gingr.app/Contents/MacOS/
            else
              echo "✗ Gingr.app not found!"
              exit 1
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "release/gingr.exe" ] || [ -f "gingr.exe" ]; then
              echo "✓ gingr.exe created successfully"
              ls -lh release/gingr.exe 2>/dev/null || ls -lh gingr.exe
            else
              echo "✗ gingr.exe not found!"
              exit 1
            fi
          else
            if [ -f "gingr" ]; then
              echo "✓ gingr binary created successfully"
              ls -lh gingr
            else
              echo "✗ gingr binary not found!"
              exit 1
            fi
          fi

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          # Create DMG or zip for distribution
          zip -r gingr-macos-${{ matrix.arch }}.zip Gingr.app

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          # Create tarball
          tar czf gingr-linux-${{ matrix.arch }}.tar.gz gingr

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Create zip with executable and dependencies
          if [ -f "release/gingr.exe" ]; then
            cp release/gingr.exe .
          fi
          7z a gingr-windows-${{ matrix.arch }}.zip gingr.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gingr-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.arch }}
          path: |
            gingr-*.zip
            gingr-*.tar.gz
          retention-days: 30

  # Additional job for running extended tests
  integration-tests:
    name: Integration Tests
    needs: build-and-test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: gingr-build

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -y qt protobuf capnproto autoconf automake make gcc_linux-64 gxx_linux-64

      - name: Run integration tests
        shell: bash -l {0}
        run: |
          # Add integration tests here
          # e.g., test loading sample data files, test VCF export, etc.
          echo "Integration tests would go here"
          echo "TODO: Add tests for:"
          echo "  - Loading .ggr files"
          echo "  - VCF export"
          echo "  - Tree visualization"
